services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-reliva}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME:-reliva}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  server:
    build:
      context: ../apps/server
      dockerfile: Dockerfile
      target: server
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-reliva}:${MONGO_ROOT_PASSWORD}@mongo:27017/${DB_NAME:-reliva}?authSource=admin
      DB_NAME: ${DB_NAME:-reliva}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: ${SERVER_PORT:-8080}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      CRON_SECRET: ${CRON_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-}
      GIN_MODE: ${GIN_MODE:-release}
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    depends_on:
      mongo:
        condition: service_healthy

  seed:
    build:
      context: ../apps/server
      dockerfile: Dockerfile
      target: seed
    restart: "no"
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-reliva}:${MONGO_ROOT_PASSWORD}@mongo:27017/${DB_NAME:-reliva}?authSource=admin
      DB_NAME: ${DB_NAME:-reliva}
      SEED_EMAIL: ${SEED_EMAIL}
      SEED_PASSWORD: ${SEED_PASSWORD}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
